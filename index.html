<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Georgi Dimitrov — Portfolio</title>

  <!-- Prevent theme flash -->
  <script>
    (function () {
      const saved = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    :root,
    [data-theme="dark"] {
      --bg: #090c12;
      --surface: rgba(88, 166, 255, 0.05);
      --surface-hover: rgba(88, 166, 255, 0.1);
      --nav-bg: rgba(13, 17, 23, 0.78);
      --border: rgba(88, 166, 255, 0.14);
      --border-hover: rgba(88, 166, 255, 0.42);
      --text: #e6edf3;
      --subtext: #9aa4b2;
      --accent: #58a6ff;
      --accent-rgb: 88, 166, 255;
      --card-img-bg: #111622;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    [data-theme="light"] {
      --bg: #f6f8fc;
      --surface: rgba(37, 99, 235, 0.045);
      --surface-hover: rgba(37, 99, 235, 0.09);
      --nav-bg: rgba(255, 255, 255, 0.82);
      --border: rgba(37, 99, 235, 0.16);
      --border-hover: rgba(37, 99, 235, 0.45);
      --text: #0f172a;
      --subtext: #475569;
      --accent: #2563eb;
      --accent-rgb: 37, 99, 235;
      --card-img-bg: #e2e8f0;
      --shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    h1, h2, h3 {
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* ===== Starfield Background ===== */
    #starfield {
      position: fixed;
      inset: 0;
      z-index: -10;
      pointer-events: none;
      mask-image: linear-gradient(to bottom, black 0%, black 80%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, black 0%, black 80%, transparent 100%);
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.08; transform: scale(0.8); }
      50% { opacity: 0.75; transform: scale(1.25); }
    }

    /* ===== Theme Toggle ===== */
    #theme-toggle {
      position: fixed;
      top: 1.15rem;
      right: 1.15rem;
      z-index: 60;
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--nav-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--accent);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    #theme-toggle:hover {
      border-color: var(--border-hover);
      transform: scale(1.06);
    }

    [data-theme="dark"] .moon-icon { display: none; }
    [data-theme="light"] .sun-icon { display: none; }

    /* ===== Floating Navigation ===== */
    #main-nav {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      top: 1.25rem;
      width: min(860px, 84%);
      z-index: 50;
      border-radius: 999px;
      border: 1px solid transparent;
      transition: width 0.35s ease, background-color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
    }

    #main-nav.scrolling {
      background: var(--nav-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-color: var(--border);
      box-shadow: var(--shadow);
      width: min(620px, 90%);
    }

    #main-nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2.5rem;
      padding: 0.85rem 1.5rem;
    }

    #main-nav a {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      text-decoration: none;
      color: var(--subtext);
      font-size: 0.92rem;
      font-weight: 500;
      transition: color 0.25s ease;
    }

    #main-nav a:hover,
    #main-nav a.active {
      color: var(--accent);
    }

    .nav-dot {
      position: absolute;
      left: -14px;
      top: 50%;
      transform: translateY(-50%) scale(0);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      opacity: 0;
      transition: all 0.25s ease;
    }

    #main-nav a.active .nav-dot {
      transform: translateY(-50%) scale(1);
      opacity: 1;
    }

    .nav-icon {
      display: none;
      width: 20px;
      height: 20px;
    }

    /* ===== Layout & Reveal ===== */
    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 1.5rem 5rem;
    }

    section {
      padding: 5.5rem 0 2rem;
    }

    .section-header {
      margin-bottom: 2.75rem;
    }

    .section-header h2 {
      font-size: clamp(1.85rem, 3.2vw, 2.35rem);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 0.45rem;
    }

    .section-header h2 span {
      color: var(--accent);
    }

    .section-header p {
      color: var(--subtext);
      font-size: 0.95rem;
      max-width: 560px;
    }

    .reveal-item {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 0.65s ease, transform 0.65s ease;
    }

    .reveal-item.reveal {
      opacity: 1;
      transform: translateY(0);
    }

    /* ===== Hero ===== */
    #home {
      min-height: 88vh;
      padding-top: 7.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 0.65rem;
    }

    .avatar-wrap {
      position: relative;
      margin-bottom: 0.6rem;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      overflow: hidden;
      background: var(--card-img-bg);
      display: grid;
      place-items: center;
      font-family: "Space Grotesk", sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--accent);
      box-shadow: 0 0 45px rgba(var(--accent-rgb), 0.32);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar-glow {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--accent);
      filter: blur(55px);
      opacity: 0.22;
      z-index: -1;
    }

    .hero-eyebrow {
      color: var(--subtext);
      font-weight: 300;
      font-size: 1rem;
    }

    #home h1 {
      font-size: clamp(2.6rem, 6.5vw, 4.4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.08;
    }

    .hero-role {
      color: var(--accent);
      font-size: 1rem;
      font-weight: 500;
      margin-top: 0.25rem;
    }

    .hero-bio {
      max-width: 680px;
      color: var(--subtext);
      font-size: 1.02rem;
      line-height: 1.7;
      margin: 0.85rem auto 0;
    }

    /* Resume Pill Button */
    .resume-btn {
      margin-top: 1.6rem;
      position: relative;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.7rem 2.4rem;
      border-radius: 999px;
      text-decoration: none;
      color: var(--text);
      border: 1px solid rgba(var(--accent-rgb), 0.45);
      background: rgba(var(--accent-rgb), 0.1);
      transition: transform 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
    }

    .resume-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 26px rgba(var(--accent-rgb), 0.35);
      background: rgba(var(--accent-rgb), 0.16);
    }

    .resume-main {
      font-size: 0.96rem;
      font-weight: 500;
      transform: translateY(6px);
      transition: transform 0.25s ease;
    }

    .resume-sub {
      font-size: 0.68rem;
      color: var(--subtext);
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .resume-btn:hover .resume-main {
      transform: translateY(0);
    }

    .resume-btn:hover .resume-sub {
      opacity: 1;
      transform: translateY(0);
    }

    /* Social Icons Row */
    .social-row {
      display: flex;
      gap: 1.65rem;
      margin-top: 1.4rem;
    }

    .social-link {
      position: relative;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      transition: color 0.25s ease, transform 0.25s ease;
    }

    .social-link:hover {
      color: var(--accent);
      transform: scale(1.12);
    }

    .social-link svg {
      width: 30px;
      height: 30px;
    }

    .social-label {
      position: absolute;
      bottom: -22px;
      font-size: 0.72rem;
      color: var(--accent);
      opacity: 0;
      transform: scale(0.8);
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .social-link:hover .social-label {
      opacity: 1;
      transform: scale(1);
    }

    /* ===== Project Cards ===== */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 1.75rem;
    }

    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.35s ease, transform 0.35s ease, box-shadow 0.35s ease;
    }

    .project-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-4px);
      box-shadow: var(--shadow);
    }

    .card-media {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: var(--card-img-bg);
      display: block;
    }

    .card-media img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.9s ease, transform 0.8s ease;
    }

    .card-media img.active {
      opacity: 1;
      z-index: 1;
    }

    .project-card:hover .card-media img.active {
      transform: scale(1.06);
    }

    /* Stylized fallback when no screenshot file is uploaded yet */
    .media-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 1.25rem;
      text-align: center;
      background: radial-gradient(circle at top right, rgba(var(--accent-rgb), 0.22), transparent 60%), var(--card-img-bg);
      color: var(--subtext);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
    }

    .media-fallback strong {
      color: var(--accent);
      font-size: 0.95rem;
      letter-spacing: 0.06em;
    }

    .platform-badges {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      z-index: 5;
      display: flex;
      gap: 0.4rem;
    }

    .platform-badge {
      padding: 0.35rem 0.5rem;
      border-radius: 8px;
      background: var(--nav-bg);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.7rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .card-body {
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      flex: 1;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
    }

    .card-category {
      display: block;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-weight: 700;
      color: var(--accent);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-top: 0.2rem;
    }

    .card-ext-link {
      color: var(--accent);
      opacity: 0.8;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .card-ext-link:hover {
      opacity: 1;
      transform: translate(2px, -2px);
    }

    .card-desc {
      color: var(--subtext);
      font-size: 0.9rem;
      line-height: 1.55;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: auto;
      padding-top: 0.25rem;
    }

    .tag {
      font-size: 0.72rem;
      padding: 0.28rem 0.7rem;
      border-radius: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--accent);
      transition: border-color 0.25s ease;
    }

    .project-card:hover .tag {
      border-color: var(--border-hover);
    }

    /* ===== 3D Game WIP Showcase ===== */
    .wip-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 0;
    }

    .wip-gallery {
      padding: 1.25rem;
      background: rgba(0, 0, 0, 0.14);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .wip-stage {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      background: var(--card-img-bg);
      border: 1px solid var(--border);
      cursor: zoom-in;
    }

    .wip-stage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .wip-stage:hover img {
      transform: scale(1.03);
    }

    .wip-thumbs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
    }

    .wip-thumb {
      position: relative;
      aspect-ratio: 16 / 10;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid transparent;
      background: var(--card-img-bg);
      cursor: pointer;
      padding: 0;
      transition: border-color 0.2s ease, opacity 0.2s ease;
      opacity: 0.7;
    }

    .wip-thumb.active,
    .wip-thumb:hover {
      opacity: 1;
      border-color: var(--accent);
    }

    .wip-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb-placeholder {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      font-size: 0.72rem;
      color: var(--subtext);
      font-family: ui-monospace, monospace;
    }

    .wip-info {
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1rem;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      width: fit-content;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      background: rgba(var(--accent-rgb), 0.12);
      border: 1px solid rgba(var(--accent-rgb), 0.35);
      color: var(--accent);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0.6); }
      50% { opacity: 0.6; box-shadow: 0 0 0 6px rgba(var(--accent-rgb), 0); }
    }

    .wip-info h3 {
      font-size: 1.55rem;
      line-height: 1.2;
    }

    .wip-info p {
      color: var(--subtext);
      font-size: 0.93rem;
    }

    .wip-note {
      font-size: 0.82rem;
      color: var(--subtext);
      border-left: 2px solid var(--accent);
      padding-left: 0.75rem;
    }

    /* Lightbox */
    #lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(5, 8, 14, 0.9);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      cursor: zoom-out;
    }

    #lightbox.open {
      display: flex;
    }

    #lightbox img {
      max-width: 92vw;
      max-height: 86vh;
      border-radius: 12px;
      border: 1px solid var(--border-hover);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.7);
    }

    /* ===== Tech Stack ===== */
    .tech-groups {
      display: flex;
      flex-direction: column;
      gap: 2.25rem;
    }

    .tech-group h3 {
      font-family: "Inter", sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: var(--subtext);
      margin-bottom: 0.9rem;
    }

    .tech-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
      gap: 1rem;
    }

    .skill-card {
      display: flex;
      align-items: stretch;
      min-height: 62px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      overflow: hidden;
      transition: border-color 0.25s ease, background-color 0.25s ease, transform 0.25s ease;
    }

    .skill-card:hover {
      border-color: var(--border-hover);
      background: var(--surface-hover);
      transform: translateY(-2px);
    }

    .skill-icon {
      width: 54px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      background: rgba(var(--accent-rgb), 0.13);
      color: var(--accent);
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .skill-icon svg {
      width: 26px;
      height: 26px;
      transition: transform 0.25s ease;
    }

    .skill-card:hover .skill-icon svg {
      transform: scale(1.1);
    }

    .skill-content {
      padding: 0.65rem 0.9rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.35rem;
    }

    .skill-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .skill-name {
      font-size: 0.86rem;
      font-weight: 500;
      color: var(--text);
    }

    .skill-score {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent);
    }

    .skill-dots {
      display: flex;
      gap: 4px;
    }

    .skill-dots i {
      display: block;
      height: 4px;
      flex: 1;
      border-radius: 99px;
      background: var(--border);
    }

    .skill-dots i.on {
      background: var(--accent);
    }

    /* ===== Contact & Footer ===== */
    .contact-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.25rem;
    }

    .contact-card {
      width: 245px;
      padding: 1.9rem 1.25rem;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      text-align: center;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.25s ease, background-color 0.25s ease, transform 0.25s ease;
    }

    .contact-card:hover {
      border-color: var(--border-hover);
      background: var(--surface-hover);
      transform: translateY(-4px);
    }

    .contact-card svg {
      width: 36px;
      height: 36px;
      color: var(--accent);
      margin-bottom: 0.75rem;
      transition: transform 0.25s ease;
    }

    .contact-card:hover svg {
      transform: scale(1.1);
    }

    .contact-card h3 {
      font-size: 1rem;
      margin-bottom: 0.25rem;
    }

    .contact-card p {
      font-size: 0.78rem;
      color: var(--subtext);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    footer {
      margin-top: 4.5rem;
      padding-top: 1.75rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      font-size: 0.84rem;
      color: var(--subtext);
    }

    /* ===== Back to Top Progress Button ===== */
    #to-top {
      position: fixed;
      right: 1.5rem;
      bottom: 1.5rem;
      z-index: 55;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--nav-bg);
      backdrop-filter: blur(10px);
      display: grid;
      place-items: center;
      cursor: pointer;
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    #to-top.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
